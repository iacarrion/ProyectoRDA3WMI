<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herramientas Mobile - EduPlaner</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #000;
    background: #fff;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .phone {
    width: 320px;
    border: 2px solid #000;
    border-radius: 30px;
    padding: 10px;
  }

  .statusbar {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 6px 10px 10px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px 15px;
  }

  .header .close {
    border: 1px solid #000;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  .header .title {
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  .header .send {
    border: 1px solid #000;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #000;
    border-radius: 18px;
    padding: 8px 12px;
    margin: 0 10px 20px;
    font-size: 12px;
  }

  .search-box input {
    border: none;
    outline: none;
    flex: 1;
    font-size: 12px;
  }

  .pills {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 10px 20px;
  }

  .pill {
    border: 1px solid #000;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
    font-size: 13px;
  }

  .pill.selected {
    border-width: 2px;
    font-weight: bold;
  }

  .keyboard {
    border-top: 1px solid #000;
    padding: 10px 6px;
  }

  .kb-toolbar {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .kb-row {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 5px;
  }

  .key {
    border: 1px solid #000;
    border-radius: 4px;
    width: 24px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }

  .key.wide {
    width: 40px;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="statusbar">
    <span>9:41</span>
    <span>&#128246; &#128225; &#128267;</span>
  </div>

  <div class="header">
    <span class="close">&times;</span>
    <span class="title">HERRAMIENTAS</span>
    <span class="send">&#8593;</span>
  </div>

  <div class="search-box">
    <span>&#128269;</span>
    <input type="text" placeholder="Busca lo que necesites">
    <span>&#127908;</span>
  </div>

  <div class="pills">
    <div class="pill">Materias</div>
    <div class="pill">Prioridad</div>
    <div class="pill selected">Fecha de entrega</div>
    <div class="pill">Estado</div>
    <div class="pill">Tipo de actividad</div>
  </div>

  <div class="keyboard">
    <div class="kb-toolbar">
      <span>GIF</span>
      <span>&#9881;</span>
      <span>Aa</span>
      <span>...</span>
      <span>&#127908;</span>
    </div>
    <div class="kb-row">
      <div class="key">q</div><div class="key">w</div><div class="key">e</div><div class="key">r</div><div class="key">t</div><div class="key">y</div><div class="key">u</div><div class="key">i</div><div class="key">o</div><div class="key">p</div>
    </div>
    <div class="kb-row">
      <div class="key">a</div><div class="key">s</div><div class="key">d</div><div class="key">f</div><div class="key">g</div><div class="key">h</div><div class="key">j</div><div class="key">k</div><div class="key">l</div>
    </div>
    <div class="kb-row">
      <div class="key wide">&#8679;</div>
      <div class="key">z</div><div class="key">x</div><div class="key">c</div><div class="key">v</div><div class="key">b</div><div class="key">n</div><div class="key">m</div>
      <div class="key wide">&#9003;</div>
    </div>
    <div class="kb-row">
      <div class="key wide">123</div>
      <div class="key wide">&#128512;</div>
      <div class="key" style="width:110px;">espacio</div>
      <div class="key wide">&#9166;</div>
    </div>
  </div>

</div>

</body>
</html>
