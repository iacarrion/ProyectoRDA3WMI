<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progreso - EduPlaner</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #000;
    background: #fff;
  }

  header {
    border-bottom: 2px solid #000;
    padding: 20px;
  }

  header h1 {
    margin: 0;
    font-size: 22px;
  }

  main {
    padding: 20px;
  }

  .chart-box {
    border: 1px solid #000;
    padding: 15px;
    margin-bottom: 30px;
  }

  .chart-box h2 {
    text-align: center;
    font-size: 16px;
    margin-top: 0;
  }

  .chart-wrapper {
    display: flex;
    gap: 15px;
    align-items: flex-start;
  }

  svg {
    border: 1px solid #000;
  }

  .legend {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 12px;
  }

  .legend li {
    margin-bottom: 8px;
  }

  .legend .line {
    display: inline-block;
    width: 16px;
    height: 0;
    border-top: 2px solid #000;
    margin-right: 6px;
    vertical-align: middle;
  }

  .legend .dashed {
    border-top-style: dashed;
  }

  .legend .dotted {
    border-top-style: dotted;
  }

  h2.section-title {
    margin-bottom: 15px;
  }

  .subject-row {
    border: 1px solid #000;
    border-bottom: none;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .subject-row:last-child {
    border-bottom: 1px solid #000;
  }

  .subject-row a {
    color: #000;
    text-decoration: underline;
    font-size: 13px;
    white-space: nowrap;
    margin-left: 10px;
  }

  @media (max-width: 600px) {
    .chart-wrapper {
      flex-direction: column;
      align-items: center;
    }
  }
</style>
</head>
<body>

<header>
  <h1>PROGRESO</h1>
</header>

<main>

  <div class="chart-box">
    <h2>Comparacion de tendencias</h2>
    <div class="chart-wrapper">
      <svg width="320" height="220" viewBox="0 0 320 220">
        <line x1="40" y1="10" x2="40" y2="190" stroke="#000" stroke-width="1"/>
        <line x1="40" y1="190" x2="300" y2="190" stroke="#000" stroke-width="1"/>

        <text x="5" y="30" font-size="10">Bueno</text>
        <text x="5" y="102" font-size="10">Regular</text>
        <text x="5" y="185" font-size="10">Malo</text>

        <text x="140" y="210" font-size="10">Tiempo (semanas)</text>

        <polyline points="40,150 100,120 160,90 220,55 280,25" fill="none" stroke="#000" stroke-width="2"/>
        <polyline points="40,40 100,70 160,100 220,140 280,170" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6,4"/>
        <polyline points="40,90 100,95 160,80 220,100 280,90" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="2,3"/>
      </svg>

      <ul class="legend">
        <li><span class="line"></span>Notas</li>
        <li><span class="line dashed"></span>Tareas entregadas a tiempo</li>
        <li><span class="line dotted"></span>Participacion en clase</li>
      </ul>
    </div>
  </div>

  <h2 class="section-title">Progreso por materia</h2>

  <div class="subject-row">
    <span>Fisica</span>
    <a href="#">Ver mejoras</a>
  </div>
  <div class="subject-row">
    <span>Desarrollo web</span>
    <a href="#">Ver mejoras</a>
  </div>
  <div class="subject-row">
    <span>Programacion orientada a objetos</span>
    <a href="#">Ver mejoras</a>
  </div>
  <div class="subject-row">
    <span>Interaccion e inteligencia artificial</span>
    <a href="#">Ver mejoras</a>
  </div>

</main>

</body>
</html>
