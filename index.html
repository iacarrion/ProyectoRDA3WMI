<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EduPlaner - Calendario académico</title>
</head>
<body>

  <header>
    <h1>EduPlaner</h1>
    <img src="assets/avatar.png" alt="Foto de perfil del usuario">
  </header>

  <main>
    <section id="calendario" aria-labelledby="calendario-titulo">
  <h2 id="calendario-titulo">Calendario</h2>
  <nav aria-label="Navegación de mes">
    <button type="button" aria-label="Mes anterior">‹</button>
    <span>Septiembre</span>
    <label for="anio-select">Año</label>
    <select id="anio-select">
      <option value="2025">2025</option>
    </select>
    <button type="button" aria-label="Mes siguiente">›</button>
  </nav>

  <table>
    <caption>Días de septiembre 2025</caption>
    <thead>
      <tr><th>Lu</th><th>Ma</th><th>Mi</th><th>Ju</th><th>Vi</th><th>Sa</th><th>Do</th></tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr>
      <tr><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td></tr>
      <!-- resto de semanas -->
    </tbody>
  </table>

  <!-- Sigue en Parte 3 -->
</section>
        <nav aria-label="Materias">
    <button type="button" aria-expanded="false" aria-controls="mat-calendario">Calendario académico</button>
    <div id="mat-calendario" hidden>Contenido de calendario académico</div>

    <button type="button" aria-expanded="false" aria-controls="mat-matematica">Matemática</button>
    <div id="mat-matematica" hidden>Contenido de matemática</div>

    <button type="button" aria-expanded="false" aria-controls="mat-estructura">Estructura de datos</button>
    <div id="mat-estructura" hidden>Contenido de estructura de datos</div>

    <button type="button" aria-expanded="false" aria-controls="mat-herramientas">Herramientas digitales</button>
    <div id="mat-herramientas" hidden>Contenido de herramientas digitales</div>

    <button type="button" aria-expanded="false" aria-controls="mat-redes">Redes</button>
    <div id="mat-redes" hidden>Contenido de redes</div>
    </nav>
    <section id="examenes" aria-labelledby="examenes-titulo">
  <h2 id="examenes-titulo">Exámenes</h2>

  <article>
    <label for="examen-desarrollo">Desarrollo</label>
    <input type="checkbox" id="examen-desarrollo">
  </article>

  <article>
    <label for="examen-programacion">Programación</label>
    <input type="checkbox" id="examen-programacion">
  </article>

  <article>
    <label for="examen-basedatos">Base de datos</label>
    <input type="checkbox" id="examen-basedatos">
  </article>

  <article>
    <label for="examen-redes">Redes</label>
    <input type="checkbox" id="examen-redes">
  </article>

  <article>
    <label for="examen-sistoperativo">Sistema Operativo</label>
    <input type="checkbox" id="examen-sistoperativo">
  </article>

  <article>
    <label for="examen-ia">IA</label>
    <input type="checkbox" id="examen-ia">
  </article>
</section>
  </main>


  <footer>
    <nav aria-label="Acciones principales">
      <button type="button">Regresar al inicio</button>
      <button type="button">Mis proyectos</button>
    </nav>
  </footer>

</body>
</html>
