<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuracion - EduPlaner</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #000;
    background: #fff;
  }

  .page {
    max-width: 700px;
    margin: 0 auto;
    border: 1px solid #000;
  }

  .topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    border-bottom: 1px solid #000;
    font-size: 13px;
    gap: 8px;
  }

  .topbar a {
    color: #000;
    text-decoration: none;
  }

  .topbar .title {
    font-weight: bold;
    text-transform: uppercase;
  }

  .topbar .icons span {
    margin-left: 8px;
    border: 1px solid #000;
    padding: 2px 6px;
    font-size: 11px;
  }

  h1.page-title {
    padding: 15px;
    margin: 0;
    font-size: 24px;
    border-bottom: 1px solid #000;
  }

  .panel {
    padding: 15px;
  }

  .panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    margin: 0 0 15px;
    color: #333;
  }

  .users {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .user {
    text-align: center;
    font-size: 11px;
    width: 70px;
  }

  .avatar-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid #000;
    margin: 0 auto 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
  }

  .option-list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid #000;
  }

  .option {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    padding: 12px 5px;
    border-bottom: 1px solid #000;
    font-size: 14px;
    text-decoration: none;
    color: #000;
  }

  .option .icon {
    font-size: 14px;
  }

  .gap {
    height: 15px;
  }

  /* ===== Responsivo (flexbox + media query) ===== */
  @media (max-width: 600px) {
    .page {
      border-left: none;
      border-right: none;
    }
    .panel {
      padding: 12px;
    }
    .users {
      justify-content: center;
      gap: 10px;
    }
  }

  @media (max-width: 400px) {
    h1.page-title {
      font-size: 20px;
      padding: 12px;
    }
    .topbar {
      padding: 10px 12px;
    }
    .user {
      width: 60px;
      font-size: 10px;
    }
    .avatar-circle {
      width: 40px;
      height: 40px;
      font-size: 12px;
    }
    .option {
      font-size: 13px;
    }
  }
</style>
</head>
<body class="config-page">

<div class="page">

  <div class="topbar">
    <a href="index.html">&larr; Volver</a>
    <span class="title">Configuracion</span>
    <div class="icons">
      <span>[ ]</span>
      <span>[ ]</span>
      <span>[ ]</span>
    </div>
  </div>

  <h1 class="page-title">CONFIGURACION</h1>

  <div class="panel">
    <h2>Elegir usuario</h2>

    <div class="users">
    <div class="users">
      <div class="user add-user">
        <div class="avatar-circle add-user-circle">+</div>
        Agregar usuario
      </div>
    </div>
      </div>
    </div>

    <div class="option-list">
      <a href="#" class="option"><span>Editar nombre</span><span class="icon">&#9998;</span></a>
      <a href="#" class="option"><span>Accesibilidad</span><span class="icon">&#9776;</span></a>
      <a href="#" class="option"><span>Agregar a favoritos</span><span class="icon">&#9734;</span></a>
      <a href="#" class="option"><span>Buscar usuario</span><span class="icon">&#128269;</span></a>
      <a href="#" class="option"><span>Agregar usuario</span><span class="icon">+</span></a>
    </div>

    <div class="gap"></div>

    <div class="option-list">
      <a href="#" class="option"><span>Cambiar nombre</span><span class="icon">&#9998;</span></a>
      <a href="#" class="option"><span>Cerrar sesion</span><span class="icon">&#9099;</span></a>
    </div>
  </div>

</div>

</body>
</html>
