<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herramientas - EduPlaner</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #000;
    background: #fff;
  }

  .layout {
    background: #d9f2d9;
    display: flex;
    min-height: 100vh;
    border: 1px solid #000;
  }

  .sidebar {
    width: 260px;
    border-right: 1px solid #000;
    padding: 15px;
    flex-shrink: 0;
  }

  .sidebar-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    font-size: 13px;
  }

  .sidebar-top .icons span {
    margin-left: 8px;
    border: 1px solid #000;
    padding: 2px 6px;
    font-size: 11px;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #000;
    padding: 6px 10px;
    margin-bottom: 15px;
    font-size: 13px;
  }

  .search-box input {
    border: none;
    outline: none;
    flex: 1;
    font-size: 13px;
  }

  .filter-list {
    display: flex;
    flex-direction: column;
  }

  .filter-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid #000;
    font-size: 14px;
  }

  .filter-item:last-child {
    border-bottom: 1px solid #000;
  }

  .filter-item .left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .checkbox {
    width: 14px;
    height: 14px;
    border: 1px solid #000;
    flex-shrink: 0;
  }

  .filter-item a {
    color: #000;
    text-decoration: underline;
    font-size: 12px;
  }

  .content {
    flex: 1;
    padding: 20px;
  }

  .content .search-box {
    max-width: 400px;
  }

  .content h1 {
    margin-top: 20px;
    font-size: 22px;
  }
</style>
</head>
<body class="herramientas-page">

<div class="layout">

  <div class="sidebar">
    <div class="sidebar-top">
      <span>Editar</span>
      <div class="icons">
        <span>o</span>
        <span>&#9670;</span>
        <span>[ ]</span>
      </div>
    </div>

    <div class="search-box">
      <span>&#128269;</span>
      <input type="text" placeholder="Buscar">
    </div>

    <div class="filter-list">
      <div class="filter-item">
        <div class="left"><span class="checkbox"></span>Materias</div>
        <a href="#">Detalle</a>
      </div>
      <div class="filter-item">
        <div class="left"><span class="checkbox"></span>Prioridad</div>
        <a href="#">Detalle</a>
      </div>
      <div class="filter-item">
        <div class="left"><span class="checkbox"></span>Fecha de entrega</div>
        <a href="#">Detalle</a>
      </div>
      <div class="filter-item">
        <div class="left"><span class="checkbox"></span>Estado</div>
        <a href="#">Detalle</a>
      </div>
      <div class="filter-item">
        <div class="left"><span class="checkbox"></span>Tipo de actividad</div>
        <a href="#">Detalle</a>
      </div>
      <div class="filter-item">
        <div class="left"><span class="checkbox"></span>Docente</div>
        <a href="#">Detalle</a>
      </div>
      <div class="filter-item">
        <div class="left"><span class="checkbox"></span>Calificacion</div>
        <a href="#">Detalle</a>
      </div>
      <div class="filter-item">
        <div class="left"><span class="checkbox"></span>Etiquetas</div>
        <a href="#">Detalle</a>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="search-box">
      <span>&#128269;</span>
      <input type="text" placeholder="Busca lo que necesites">
    </div>
    <h1>Herramientas</h1>
  </div>

</div>

</body>
</html>
