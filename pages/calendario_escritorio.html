<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Calendario academico de EduPlaner, con examenes y materias organizadas.">
<meta name="author" content="EduPlaner Team">
<title>EduPlaner - Calendario</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="calendar-page">

<header class="topbar">
  <h1>EDUPLANER</h1>
  <div class="avatar" role="img" aria-label="Foto de perfil de usuario"></div>
</header>

<section class="calendar-widget" aria-label="Calendario">
  <div class="calendar-nav">
    <button type="button" aria-label="Mes anterior">&lsaquo;</button>
    <select aria-label="Mes">
      <option>Sep</option>
    </select>
    <select aria-label="Año">
      <option>2025</option>
    </select>
    <button type="button" aria-label="Mes siguiente">&rsaquo;</button>
  </div>

  <table class="calendar-grid">
    <thead>
      <tr>
        <th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th>
      </tr>
    </thead>
    <tbody>
      <tr><td></td><td></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>
      <tr><td>6</td><td>7</td><td>8</td><td class="today">9</td><td>10</td><td>11</td><td class="selected">12</td></tr>
      <tr><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td></tr>
      <tr><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td></tr>
      <tr><td>27</td><td>28</td><td>29</td><td>30</td><td class="muted">1</td><td class="muted">2</td><td class="muted">3</td></tr>
    </tbody>
  </table>
</section>

<section class="accordion" aria-label="Materias">

  <div class="accordion-item open">
    <button type="button" class="accordion-header">
      CALENDARIO ACADEMICO
      <span class="chevron">^</span>
    </button>
  </div>

  <div class="accordion-item">
    <button type="button" class="accordion-header">
      Matematica
      <span class="chevron">v</span>
    </button>
  </div>

  <div class="accordion-item">
    <button type="button" class="accordion-header">
      Estructura de datos
      <span class="chevron">v</span>
    </button>
  </div>

  <div class="accordion-item">
    <button type="button" class="accordion-header">
      Herramientas digitales
      <span class="chevron">v</span>
    </button>
  </div>

  <div class="accordion-item">
    <button type="button" class="accordion-header">
      Redes
      <span class="chevron">v</span>
    </button>
  </div>

</section>

<section class="exam-list" aria-label="Examenes">
  <h2>Examenes</h2>

  <ul id="listaExamenes"></ul>
    </li>
  </ul>
  <button type="button" id="btnAgregarExamen" class="btn btn--outline" style="margin-top:12px;">+ Agregar examen</button>
</section>

<footer class="calendar-actions">
  <a href="../index.html" class="btn btn--outline">&#9654; Regresar al inicio</a>
  <a href="proyectos_escritorio.html" class="btn btn--outline">&#9654; Mis proyectos</a>
</footer>

<script>
  document.querySelectorAll('.accordion-header').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const item = btn.closest('.accordion-item');
      const isOpen = item.classList.contains('open');

      document.querySelectorAll('.accordion-item').forEach(function (el) {
        el.classList.remove('open');
        el.querySelector('.chevron').textContent = 'v';
      });

      if (!isOpen) {
        item.classList.add('open');
        btn.querySelector('.chevron').textContent = '^';
      }
    });
  });

  const EXAM_KEY = "eduplaner_examenes";

  function cargarExamenesData() {
    const guardado = localStorage.getItem(EXAM_KEY);
    if (guardado) return JSON.parse(guardado);

    const inicial = [
      { nombre: "Desarrollo", completado: true },
      { nombre: "Programacion", completado: true },
      { nombre: "Base de datos", completado: true },
      { nombre: "Redes", completado: true },
      { nombre: "Sistema Operativo", completado: true },
      { nombre: "IA", completado: true }
    ];
    localStorage.setItem(EXAM_KEY, JSON.stringify(inicial));
    return inicial;
  }

  function guardarExamenesData(examenes) {
    localStorage.setItem(EXAM_KEY, JSON.stringify(examenes));
  }

  function renderizarExamenes() {
    const examenes = cargarExamenesData();
    const lista = document.getElementById("listaExamenes");
    lista.innerHTML = "";

    examenes.forEach(function(examen, index) {
      const li = document.createElement("li");
      li.style.opacity = examen.completado ? "1" : "0.5";

      const spanAvatar = document.createElement("span");
      spanAvatar.className = "exam-avatar";
      spanAvatar.textContent = examen.nombre.charAt(0).toUpperCase();

      const spanNombre = document.createElement("span");
      spanNombre.className = "exam-name";
      spanNombre.textContent = examen.nombre;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = examen.completado;

      li.appendChild(spanAvatar);
      li.appendChild(spanNombre);
      li.appendChild(checkbox);
      lista.appendChild(li);

      checkbox.addEventListener("change", function() {
        examen.completado = checkbox.checked;
        li.style.opacity = checkbox.checked ? "1" : "0.5";
        guardarExamenesData(examenes);
      });
    });
  }

  document.getElementById("btnAgregarExamen").addEventListener("click", function() {
    const nombre = prompt("Nombre del examen:");
    if (!nombre) return;

    const examenes = cargarExamenesData();
    examenes.push({ nombre: nombre, completado: false });
    guardarExamenesData(examenes);
    renderizarExamenes();
  });

  renderizarExamenes();
</script>
</body>
</html>
