<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Recordatorios y notificaciones de EduPlaner.">
<meta name="author" content="EduPlaner Team">
<title>EduPlaner - Recordatorios</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="topbar">
  <a href="../index.html" style="text-decoration:none;color:inherit;font-weight:bold;">&larr; EDUPLANER</a>
  <div class="avatar" role="img" aria-label="Foto de perfil de usuario"></div>
</header>

<section style="padding: var(--space-lg); max-width: 700px; margin: 0 auto;">

  <h1 style="font-size:1.6rem; color:var(--color-text); margin-bottom: var(--space-md);">Recordatorios</h1>

  <div class="alert alert--success" role="status">
    <span class="alert-icon">&#128276;</span>
    <span>Tienes 3 recordatorios activos para esta semana.</span>
  </div>

  <div class="recordatorios-grid" style="display:flex; flex-direction:column; gap: var(--space-sm);">

    <div class="card" style="flex-direction:row; align-items:center; gap:14px;">
      <div class="icon-box" aria-hidden="true"></div>
      <div>
        <h3>Entrega de proyecto final</h3>
        <p style="margin:2px 0 0; font-size:0.85rem; color:var(--color-muted);">Vence en 2 dÃ­as</p>
      </div>
    </div>

    <div class="card" style="flex-direction:row; align-items:center; gap:14px;">
      <div class="icon-box" aria-hidden="true"></div>
      <div>
        <h3>Examen de Base de Datos</h3>
        <p style="margin:2px 0 0; font-size:0.85rem; color:var(--color-muted);">Vence en 5 dÃ­as</p>
      </div>
    </div>

    <div class="card" style="flex-direction:row; align-items:center; gap:14px;">
      <div class="icon-box" aria-hidden="true"></div>
      <div>
        <h3>Reunion de equipo</h3>
        <p style="margin:2px 0 0; font-size:0.85rem; color:var(--color-muted);">Vence maÃ±ana</p>
      </div>
    </div>

  </div>

  <button type="button" class="btn btn--primary" style="margin-top: var(--space-lg);">+ Agregar recordatorio</button>

</section>

<script>
  document.querySelectorAll('.card').forEach(function(card) {
    card.style.cursor = 'pointer';
    card.title = 'Clic para eliminar';
    card.addEventListener('click', function() {
      if (confirm('¿Eliminar este recordatorio?')) {
        card.remove();
      }
    });
  });

  document.querySelector('.btn--primary').addEventListener('click', function() {
    const titulo = prompt('Título del recordatorio:');
    if (!titulo) return;
    const fecha = prompt('¿Cuándo vence? (ej: "Vence en 3 días")', 'Vence en 3 días');

    const contenedor = document.querySelector('.btn--primary').previousElementSibling;

    const nuevaCard = document.createElement('div');
    nuevaCard.className = 'card';
    nuevaCard.style.cssText = 'flex-direction:row; align-items:center; gap:14px; cursor:pointer;';
    nuevaCard.title = 'Clic para eliminar';
    nuevaCard.innerHTML = '<div class="icon-box" aria-hidden="true"></div><div><h3>' + titulo + '</h3><p style="margin:2px 0 0; font-size:0.85rem; color:var(--color-muted);">' + (fecha || 'Sin fecha') + '</p></div>';

    nuevaCard.addEventListener('click', function() {
      if (confirm('¿Eliminar este recordatorio?')) {
        nuevaCard.remove();
      }
    });

    contenedor.appendChild(nuevaCard);
  });
</script>
</body>
</html>
