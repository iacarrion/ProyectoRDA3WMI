<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pantalla de registro de nuevos usuarios en EduPlaner.">
<meta name="author" content="EduPlaner Team">
<title>EduPlaner - Registro</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="registro-page">
<header class="topbar">
  <h1>EDUPLANER</h1>
  <div class="avatar" role="img" aria-label="Foto de perfil de usuario"></div>
</header>
<main class="auth-card">
  <h2>Crear cuenta</h2>
  <p class="subtitle">Registrate para empezar a organizar tus tareas academicas.</p>
  <div id="errorRegistro" class="alert alert--error" role="alert" style="display:none;">
    <span class="alert-icon">!</span>
    <span id="errorRegistroTexto">Revisa los campos marcados en rojo antes de continuar.</span>
  </div>
  <form id="formRegistro" novalidate>
    <div class="field">
      <label for="nombre">Nombre completo</label>
      <input class="input" type="text" id="nombre" name="nombre" placeholder="Ej. Ana Torres">
    </div>
    <div class="field">
      <label for="correo">Correo electronico</label>
      <input class="input" type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com">
      <span class="error-text" id="correo-error" style="display:none;">Ingresa un correo electronico valido.</span>
    </div>
    <div class="field">
      <label for="password">Contrasena</label>
      <input class="input" type="password" id="password" name="password" placeholder="Crea una contrasena">
      <span class="error-text" id="password-error" style="display:none;">La contrasena debe tener al menos 6 caracteres.</span>
    </div>
    <div class="field">
      <label for="password2">Confirmar contrasena</label>
      <input class="input" type="password" id="password2" name="password2" placeholder="Repite tu contrasena">
      <span class="error-text" id="password2-error" style="display:none;">Las contrasenas no coinciden.</span>
    </div>
    <button type="submit" class="btn btn--primary">Registrarme</button>
  </form>
  <p class="switch-link">Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p>
</main>

<script>
  const CUENTAS_KEY = "eduplaner_cuentas";
  const SESION_KEY = "eduplaner_sesion";

  function obtenerCuentas() {
    const guardado = localStorage.getItem(CUENTAS_KEY);
    return guardado ? JSON.parse(guardado) : [];
  }

  document.getElementById("formRegistro").addEventListener("submit", function(e) {
    e.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();
    const correo = document.getElementById("correo").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;

    const inputCorreo = document.getElementById("correo");
    const inputPassword = document.getElementById("password");
    const inputPassword2 = document.getElementById("password2");
    const errorCorreo = document.getElementById("correo-error");
    const errorPassword = document.getElementById("password-error");
    const errorPassword2 = document.getElementById("password2-error");
    const errorBox = document.getElementById("errorRegistro");

    inputCorreo.classList.remove("input--error");
    inputPassword.classList.remove("input--error");
    inputPassword2.classList.remove("input--error");
    errorCorreo.style.display = "none";
    errorPassword.style.display = "none";
    errorPassword2.style.display = "none";
    errorBox.style.display = "none";

    let hayError = false;
    const correoValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);

    if (!nombre) {
      hayError = true;
    }
    if (!correoValido) {
      inputCorreo.classList.add("input--error");
      errorCorreo.style.display = "block";
      hayError = true;
    }
    if (password.length < 6) {
      inputPassword.classList.add("input--error");
      errorPassword.style.display = "block";
      hayError = true;
    }
    if (password !== password2) {
      inputPassword2.classList.add("input--error");
      errorPassword2.style.display = "block";
      hayError = true;
    }

    const cuentas = obtenerCuentas();
    if (cuentas.some(c => c.correo === correo)) {
      document.getElementById("errorRegistroTexto").textContent = "Ya existe una cuenta con ese correo. Intenta iniciar sesion.";
      errorBox.style.display = "flex";
      hayError = true;
    }

    if (hayError) {
      if (!document.getElementById("errorRegistroTexto").textContent.includes("Ya existe")) {
        document.getElementById("errorRegistroTexto").textContent = "Revisa los campos marcados en rojo antes de continuar.";
      }
      errorBox.style.display = "flex";
      return;
    }

    cuentas.push({ nombre: nombre, correo: correo, password: password });
    localStorage.setItem(CUENTAS_KEY, JSON.stringify(cuentas));
    localStorage.setItem(SESION_KEY, JSON.stringify({ nombre: nombre, correo: correo }));

    window.location.href = "../index.html";
  });
</script>
</body>
</html>
