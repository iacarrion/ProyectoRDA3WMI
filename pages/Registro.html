<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pantalla de registro de nuevos usuarios en EduPlaner.">
<meta name="author" content="EduPlaner Team">
<title>EduPlaner - Registro</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="registro-page">

<header class="topbar">
  <h1>EDUPLANER</h1>
  <div class="avatar" role="img" aria-label="Foto de perfil de usuario"></div>
</header>

<main class="auth-card">
  <h2>Crear cuenta</h2>
  <p class="subtitle">Regístrate para empezar a organizar tus tareas académicas.</p>
  <div class="alert alert--error" role="alert">
    <span class="alert-icon">!</span>
    <span>Revisa los campos marcados en rojo antes de continuar.</span>
  </div>

  <form novalidate>

    <div class="field">
      <label for="nombre">Nombre completo</label>
      <input class="input" type="text" id="nombre" name="nombre" placeholder="Ej. Ana Torres">
    </div>

    <div class="field">
      <label for="correo">Correo electrónico</label>
      <input class="input input--error" type="email" id="correo" name="correo" value="ana@" aria-describedby="correo-error">
      <span class="error-text" id="correo-error">Ingresa un correo electrónico válido.</span>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input class="input" type="password" id="password" name="password" placeholder="Crea una contraseña">
    </div>

    <div class="field">
      <label for="password2">Confirmar contraseña</label>
      <input class="input" type="password" id="password2" name="password2" placeholder="Repite tu contraseña">
    </div>

    <button type="submit" class="btn btn--primary">Registrarme</button>
  </form>

  <p class="switch-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
</main>

</body>
</html>
