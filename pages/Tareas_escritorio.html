<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas - EduPlaner</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #000;
    background: #fff;
  }

  .page {
    max-width: 700px;
    margin: 0 auto;
    border: 1px solid #000;
    padding: 20px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .topbar a {
    color: #000;
    text-decoration: none;
    font-size: 18px;
  }

  .topbar .icons span {
    margin-left: 12px;
    border: 1px solid #000;
    padding: 4px 8px;
    font-size: 12px;
  }

  .images {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .images div {
    flex: 1;
    border: 1px solid #000;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .badge {
    position: absolute;
    top: 6px;
    left: 6px;
    border: 1px solid #000;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    background: #fff;
  }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 25px;
  }

  .actions button {
    padding: 8px 16px;
    border: 1px solid #000;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    border-radius: 4px;
  }

  .task-list {
    display: flex;
    flex-direction: column;
  }

  .task {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 15px 0;
    border-top: 1px solid #000;
  }

  .task:last-child {
    border-bottom: 1px solid #000;
  }

  .task .icon {
    width: 36px;
    height: 36px;
    border: 1px solid #000;
    flex-shrink: 0;
  }

  .task h3 {
    margin: 0 0 4px;
    font-size: 15px;
  }

  .task p {
    margin: 0;
    font-size: 13px;
    color: #333;
  }
</style>
</head>
<body class="tareas-page">

<div class="tareas-card">

  <div class="tareas-topbar">
    <a href="../index.html">&larr;</a>
    <div class="tareas-icons">
      <span>&#9998;</span>
      <span>&#128206;</span>
      <span>&#8942;</span>
    </div>
  </div>

  <div class="tareas-images">
    <div style="background-image:url('https://images.unsplash.com/photo-1509266272358-7701da638078?w=400')"></div>
    <div style="background-image:url('https://images.unsplash.com/photo-1517842645767-c639042777db?w=400')"></div>
  </div>

  <div class="tareas-actions">
    <button class="btn-calendar">&#128197; Anadir al calendario</button>
    <button class="btn-pendiente">&#10003; Pendiente</button>
    <button class="btn-realizadas">Realizadas</button>
  </div>

  <div id="formNuevaTarea" style="display:flex; flex-direction:column; gap:8px; background:#f7f8fa; border-radius:12px; padding:14px; margin-bottom:16px;">
    <select id="inputMateria" class="input">
      <option value="Redes">Redes</option>
      <option value="Desarrollo web">Desarrollo web</option>
      <option value="Programacion orientada a objetos">Programacion orientada a objetos</option>
      <option value="Interaccion e inteligencia artificial">Interaccion e inteligencia artificial</option>
    <option value="__otra__">+ Otra materia...</option>
    </select>
    <input type="text" id="inputMateriaOtra" class="input" placeholder="Nombre de la nueva materia" style="display:none;">
    <input type="text" id="inputTitulo" class="input" placeholder="Titulo de la tarea">
    <input type="text" id="inputDescripcion" class="input" placeholder="Descripcion breve">
    <button id="btnAgregarTarea" class="btn btn--primary" style="align-self:flex-start;">+ Agregar tarea</button>
  </div>

  <div class="tareas-list">
  <div class="tareas-list" id="listaTareas"></div>

</div>

<script>
  const STORAGE_KEY = "eduplaner_tareas";

  function cargarTareas() {
    const guardado = localStorage.getItem(STORAGE_KEY);
    if (guardado) return JSON.parse(guardado);

    const inicial = [
      { materia: "Desarrollo web", titulo: "Tarea2-Desarrollo Web", descripcion: "Crear los user person en base a las encuestas", completada: false },
      { materia: "Programacion orientada a objetos", titulo: "Codigo de practica-Poo", descripcion: "Realizar el codigo similar al que se vio en clase", completada: false },
      { materia: "Redes", titulo: "Evaluacion RDA1-Base de datos", descripcion: "Repasar consultas y estructura relacional", completada: false },
      { materia: "Interaccion e inteligencia artificial", titulo: "Entrenamiento de modelo IA", descripcion: "Ajustar hiperparametros del modelo de clasificacion", completada: false }
    ];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(inicial));
    return inicial;
  }

  function guardarTareas(tareas) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tareas));
  }

  function renderizarTareas() {
    const tareas = cargarTareas();
    const lista = document.getElementById("listaTareas");
    lista.innerHTML = "";

    tareas.forEach(function(tarea, index) {
      const item = document.createElement("div");
      item.className = "tareas-item";
      item.dataset.materia = tarea.materia;
      if (tarea.completada) {
        item.style.opacity = "0.5";
        item.style.textDecoration = "line-through";
      }

      item.innerHTML =
        '<input type="checkbox" class="tareas-check" ' + (tarea.completada ? "checked" : "") + '>' +
        '<div class="icon-box"></div>' +
        '<div><h3>' + tarea.titulo + '</h3>' +
        '<p>' + tarea.descripcion + ' &middot; <em>' + tarea.materia + '</em></p></div>';

      item.querySelector(".tareas-check").addEventListener("change", function() {
        tarea.completada = this.checked;
        guardarTareas(tareas);
        renderizarTareas();
        if (typeof sincronizarConTareas === "function") sincronizarConTareas();
      });

      lista.appendChild(item);
    });
  }

  document.getElementById("inputMateria").addEventListener("change", function() {
    const otraInput = document.getElementById("inputMateriaOtra");
    otraInput.style.display = this.value === "__otra__" ? "block" : "none";
  });

  document.getElementById("btnAgregarTarea").addEventListener("click", function() {
    let materia = document.getElementById("inputMateria").value;
    if (materia === "__otra__") {
      const nueva = document.getElementById("inputMateriaOtra").value.trim();
      if (!nueva) {
        alert("Escribe el nombre de la nueva materia.");
        return;
      }
      materia = nueva;
    }
    const titulo = document.getElementById("inputTitulo").value.trim();
    const descripcion = document.getElementById("inputDescripcion").value.trim();

    if (!titulo) {
      alert("Escribe un titulo para la tarea.");
      return;
    }

    const tareas = cargarTareas();
    tareas.push({ materia: materia, titulo: titulo, descripcion: descripcion || "Sin descripcion", completada: false });
    guardarTareas(tareas);

    document.getElementById("inputTitulo").value = "";
    document.getElementById("inputDescripcion").value = "";

    renderizarTareas();
  });

  document.querySelector(".btn-pendiente").addEventListener("click", function() {
    document.querySelectorAll(".tareas-item").forEach(function(item) {
      const checked = item.querySelector(".tareas-check").checked;
      item.style.display = checked ? "none" : "flex";
    });
  });

  document.querySelector(".btn-realizadas").addEventListener("click", function() {
    document.querySelectorAll(".tareas-item").forEach(function(item) {
      const checked = item.querySelector(".tareas-check").checked;
      item.style.display = checked ? "flex" : "none";
    });
  });

  renderizarTareas();
</script>
</body>
</html>
