<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPlaner - Iniciar sesion</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="topbar">
  <h1>EDUPLANER</h1>
  <div class="avatar" role="img" aria-label="Foto de perfil de usuario"></div>
</header>
<main class="auth-card">
  <h2>Iniciar sesion</h2>
  <p class="subtitle">Ingresa tus datos para acceder a tu cuenta.</p>
  <form novalidate>
    <div class="field">
      <label for="correo">Correo electronico</label>
      <input class="input" type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com">
    </div>
    <div class="field">
      <label for="password">Contrasena</label>
      <input class="input" type="password" id="password" name="password" placeholder="Tu contrasena">
    </div>
    <button type="submit" class="btn btn--primary">Ingresar</button>
  </form>
  <p class="switch-link">Aun no tienes cuenta? <a href="Registro.html">Registrate</a></p>
</main>
</body>
</html>
